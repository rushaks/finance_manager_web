<!DOCTYPE html>
<html>
<head>
  <!--
    Базовый путь. При сборке подставляется значением аргумента --base-href
    (для GitHub Pages это /finance_manager_web/).
  -->
  <base href="/finance_manager_web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Финансовый менеджер — учёт доходов, расходов и счетов">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Финансы">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Цвет темы браузера -->
  <meta name="theme-color" content="#2196F3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Финансы</title>
  <link rel="manifest" href="manifest.json">

  <!-- Фон до первого кадра Flutter, чтобы не мигал белый экран -->
  <style>
    body { background-color: #f5f5f7; }
    @media (prefers-color-scheme: dark) {
      body { background-color: #121212; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
